<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SONOFF Power Meter — Tariff Calculator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  input[type="date"] { color-scheme: dark; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input[type="number"] { -moz-appearance: textfield; }
  .bar-fill { transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fade-up 0.35s ease both; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

<div class="max-w-lg mx-auto px-4 py-8 pb-20 flex flex-col gap-4">

  <!-- Header -->
  <div class="mb-2">
    <div class="flex items-center gap-3 mb-1">
      <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-lg flex-shrink-0">⚡</div>
      <h1 class="text-xl font-bold tracking-tight">SONOFF Power Meter</h1>
    </div>
    <p class="text-zinc-500 text-sm font-mono ml-12">Tariff analyser · Smart plug CSV</p>
  </div>

  <!-- Date Range -->
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
    <p class="text-xs font-mono text-zinc-500 uppercase tracking-widest mb-4">01 · Date Range</p>
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-xs text-zinc-400 font-medium">From</label>
        <input type="date" id="startDate"
          class="w-full min-w-0 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-zinc-100 font-mono
                 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30
                 hover:border-zinc-600 transition-colors cursor-pointer">
      </div>
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-xs text-zinc-400 font-medium">To</label>
        <input type="date" id="endDate"
          class="w-full min-w-0 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-zinc-100 font-mono
                 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30
                 hover:border-zinc-600 transition-colors cursor-pointer">
      </div>
    </div>
    <p class="text-xs text-zinc-600 mt-3 font-mono">Both dates inclusive</p>
  </div>

  <!-- Low Tariff Ranges -->
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
    <p class="text-xs font-mono text-zinc-500 uppercase tracking-widest mb-4">02 · Low Tariff Hours</p>
    <div id="rangesList" class="flex flex-col gap-2 mb-3"></div>
    <div class="grid grid-cols-[1fr_1fr_auto] gap-2 items-end">
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-xs text-zinc-400 font-medium">From (h)</label>
        <input type="number" id="rangeStart" min="0" max="23" placeholder="0–23"
          class="w-full min-w-0 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-zinc-100 font-mono
                 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
      </div>
      <div class="flex flex-col gap-1.5 min-w-0">
        <label class="text-xs text-zinc-400 font-medium">To (h)</label>
        <input type="number" id="rangeEnd" min="1" max="24" placeholder="1–24"
          class="w-full min-w-0 bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-zinc-100 font-mono
                 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
      </div>
      <button onclick="addRange()"
        class="px-4 py-2.5 rounded-xl bg-zinc-800 border border-zinc-700 text-zinc-300 text-sm font-medium
               hover:border-green-500 hover:text-green-400 transition-colors whitespace-nowrap cursor-pointer">
        + Add
      </button>
    </div>
    <p class="text-xs text-zinc-600 font-mono mt-3">Sundays always count as low tariff</p>
  </div>

  <!-- Upload -->
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
    <p class="text-xs font-mono text-zinc-500 uppercase tracking-widest mb-4">03 · Upload CSV</p>
    <div id="dropZone"
      class="relative border-2 border-dashed border-zinc-700 rounded-xl py-10 px-4 text-center
             hover:border-blue-500 hover:bg-blue-500/5 transition-all cursor-pointer">
      <input type="file" id="csvFile" accept=".csv" onchange="handleFile(this.files[0])"
        class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
      <div class="text-3xl mb-2" id="dropIcon">📂</div>
      <p class="text-sm font-medium text-zinc-200 mb-1">Drop CSV here or tap to browse</p>
      <p class="text-xs text-zinc-500 font-mono">columns: data, time, consumption/KWh</p>
      <p class="text-xs text-green-400 font-mono mt-2 font-medium" id="fileName"></p>
    </div>
    <div id="errorBox" class="hidden mt-3 bg-red-950/50 border border-red-800/60 rounded-xl px-4 py-3
                              text-red-400 text-sm font-mono whitespace-pre-wrap"></div>
    <button id="calcBtn" onclick="calculate()" disabled
      class="mt-4 w-full py-3.5 rounded-xl bg-blue-600 text-white font-semibold text-sm
             hover:bg-blue-500 active:scale-[0.98] transition-all cursor-pointer
             disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-blue-600">
      Calculate Consumption
    </button>
  </div>

  <!-- Results -->
  <div id="results" class="hidden flex-col gap-3 fade-up">
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-green-950/40 border border-green-800/40 rounded-2xl p-4">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_6px_#22c55e] flex-shrink-0"></span>
          <span class="text-xs font-mono text-green-400 uppercase tracking-wider">Low Tariff</span>
        </div>
        <p class="text-2xl font-bold tracking-tight leading-none mb-1.5" id="lowVal">—</p>
        <p class="text-xs text-zinc-500 font-mono" id="lowPct">—</p>
      </div>
      <div class="bg-red-950/40 border border-red-800/40 rounded-2xl p-4">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_6px_#ef4444] flex-shrink-0"></span>
          <span class="text-xs font-mono text-red-400 uppercase tracking-wider">High Tariff</span>
        </div>
        <p class="text-2xl font-bold tracking-tight leading-none mb-1.5" id="highVal">—</p>
        <p class="text-xs text-zinc-500 font-mono" id="highPct">—</p>
      </div>
    </div>
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-mono text-zinc-500 uppercase tracking-widest">Total</span>
        <span class="text-2xl font-bold tracking-tight" id="totalVal">—</span>
      </div>
      <div class="h-2 bg-zinc-800 rounded-full overflow-hidden">
        <div class="bar-fill h-full bg-green-500 rounded-full" id="barFill" style="width:0%"></div>
      </div>
      <div class="flex justify-between mt-2 text-xs font-mono">
        <span class="text-green-500" id="barLowLabel">Low</span>
        <span class="text-red-500" id="barHighLabel">High</span>
      </div>
    </div>
  </div>

</div>

<script>
  let lowTariffRanges = [
    { start: 0,  end: 7  },
    { start: 13, end: 15 },
    { start: 22, end: 24 },
  ];
  let csvFile = null;

  const dropZone = document.getElementById('dropZone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('!border-blue-500','!bg-blue-500/5'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('!border-blue-500','!bg-blue-500/5'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('!border-blue-500','!bg-blue-500/5');
    const f = e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  function handleFile(file) {
    if (!file || !file.name.endsWith('.csv')) { showError('Please upload a valid .csv file.'); return; }
    csvFile = file;
    document.getElementById('fileName').textContent = '✓ ' + file.name;
    dropZone.classList.add('!border-green-500');
    document.getElementById('dropIcon').textContent = '✅';
    clearError();
    updateCalcBtn();
  }

  function updateCalcBtn() {
    document.getElementById('calcBtn').disabled = !csvFile;
  }

  function renderRanges() {
    document.getElementById('rangesList').innerHTML = lowTariffRanges.map((r, i) => `
      <div class="flex items-center gap-3 bg-zinc-800/60 border border-zinc-700/50 rounded-xl px-4 py-2.5">
        <span class="w-2 h-2 rounded-full bg-green-500 flex-shrink-0"></span>
        <span class="text-sm font-mono text-zinc-300 flex-1">
          ${String(r.start).padStart(2,'0')}:00 – ${String(r.end).padStart(2,'0')}:00
        </span>
        <button onclick="removeRange(${i})"
          class="text-zinc-600 hover:text-red-400 transition-colors text-sm leading-none font-mono cursor-pointer">✕</button>
      </div>
    `).join('');
  }

  function addRange() {
    const s = parseInt(document.getElementById('rangeStart').value);
    const e = parseInt(document.getElementById('rangeEnd').value);
    if (isNaN(s) || isNaN(e) || s < 0 || s > 23 || e < 1 || e > 24) {
      showError('Enter valid hours: from 0–23, to 1–24.');
      return;
    }
    clearError();
    lowTariffRanges.push({ start: s, end: e });
    renderRanges();
    document.getElementById('rangeStart').value = '';
    document.getElementById('rangeEnd').value = '';
  }

  function removeRange(i) {
    lowTariffRanges.splice(i, 1);
    renderRanges();
  }

  function isLowTariff(startHour, endHour) {
    return lowTariffRanges.some(({ start, end }) =>
      (startHour >= start && startHour < end) ||
      (endHour > start && endHour <= end)
    );
  }

  function parseDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function calculate() {
    clearError();
    const startStr = document.getElementById('startDate').value;
    const endStr   = document.getElementById('endDate').value;
    if (!startStr || !endStr)    { showError('Please select a date range.'); return; }
    if (!csvFile)                { showError('Please upload a CSV file.'); return; }
    if (!lowTariffRanges.length) { showError('Add at least one low tariff range.'); return; }
    const startDate = parseDate(startStr);
    const endDate   = parseDate(endStr);
    if (startDate > endDate)     { showError('Start date must be before end date.'); return; }
    const reader = new FileReader();
    reader.onload = e => processCSV(e.target.result, startDate, endDate);
    reader.readAsText(csvFile);
  }

  function processCSV(text, startDate, endDate) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) { showError('CSV appears empty or has no data rows.'); return; }

    const headers = parseCSVLine(lines[0]);
    const timeIdx = headers.findIndex(h => h.toLowerCase().trim() === 'time');
    const kwIdx   = headers.findIndex(h => h.toLowerCase().trim().includes('consumption'));
    if (timeIdx === -1 || kwIdx === -1) {
      showError(`Columns not found.\nGot: ${headers.join(', ')}\nExpected: time, consumption/KWh`);
      return;
    }

    let low = 0, high = 0, skipped = 0;

    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const cols = parseCSVLine(line);
      if (cols.length < Math.max(timeIdx, kwIdx) + 1) { skipped++; continue; }

      const rowDate = parseDate(cols[0].trim());
      if (isNaN(rowDate)) { skipped++; continue; }
      if (rowDate < startDate || rowDate > endDate) continue;

      const isSunday = rowDate.getDay() === 0;
      const timeParts = cols[timeIdx].trim().split('-');
      if (timeParts.length < 2) { skipped++; continue; }
      const sh = parseInt(timeParts[0].split(':')[0]);
      const eh = parseInt(timeParts[1].split(':')[0]);
      if (isNaN(sh) || isNaN(eh)) { skipped++; continue; }

      const consumption = parseFloat(cols[kwIdx].replace(',', '.'));
      if (isNaN(consumption)) { skipped++; continue; }

      if (isSunday || isLowTariff(sh, eh)) { low += consumption; }
      else { high += consumption; }
    }

    const total = low + high;
    if (total === 0) { showError('No valid consumption data found in the selected date range.'); return; }
    showResults(low, high, total, skipped);
  }

  function parseCSVLine(line) {
    const result = [];
    let cur = '', inQ = false;
    for (const c of line) {
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
      else { cur += c; }
    }
    result.push(cur);
    return result;
  }

  function showResults(low, high, total, skipped) {
    const lowPct  = ((low  / total) * 100).toFixed(1);
    const highPct = ((high / total) * 100).toFixed(1);

    document.getElementById('lowVal').innerHTML  = `${low.toFixed(2)} <span class="text-base font-normal text-zinc-400">kWh</span>`;
    document.getElementById('highVal').innerHTML = `${high.toFixed(2)} <span class="text-base font-normal text-zinc-400">kWh</span>`;
    document.getElementById('lowPct').textContent  = `${lowPct}% of total`;
    document.getElementById('highPct').textContent = `${highPct}% of total`;
    document.getElementById('totalVal').innerHTML  = `${total.toFixed(2)} <span class="text-base font-normal text-zinc-400">kWh</span>`;
    document.getElementById('barLowLabel').textContent  = `Low ${lowPct}%`;
    document.getElementById('barHighLabel').textContent = `High ${highPct}%`;

    const results = document.getElementById('results');
    results.classList.remove('hidden');
    results.classList.add('flex');
    setTimeout(() => { document.getElementById('barFill').style.width = lowPct + '%'; }, 50);
    results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    if (skipped > 0) showError(`⚠ ${skipped} row(s) skipped due to missing or invalid data.`);
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.remove('hidden');
  }

  function clearError() {
    document.getElementById('errorBox').classList.add('hidden');
  }

  // Init
  renderRanges();
  const today     = new Date();
  const pad       = n => String(n).padStart(2, '0');
  const fmt       = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const prevMonth = new Date(today.getFullYear(), today.getMonth() - 1, 16);
  const currMonth = new Date(today.getFullYear(), today.getMonth(), 15);
  document.getElementById('startDate').value = fmt(prevMonth);
  document.getElementById('endDate').value   = fmt(currMonth);
</script>
</body>
</html>
